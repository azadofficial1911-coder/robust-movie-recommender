{% load static %}
<article class="card movie-card h-100 border-0 shadow-sm">
    {% if movie.poster %}
        <img src="{% static movie.poster %}?v=3" class="card-img-top movie-poster" alt="Poster for {{ movie.title }}">
    {% else %}
        <div class="movie-poster movie-poster-fallback" role="img" aria-label="Poster placeholder for {{ movie.title }}">
            <span>RMRS</span>
        </div>
    {% endif %}

    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <h3 class="h5 card-title mb-1">{{ movie.title }}</h3>
            <span class="badge rounded-pill text-bg-light">{{ movie.year }}</span>
        </div>
        <p class="text-secondary small mb-2">{{ movie.genres }}</p>
        <div class="rating-line mb-2" aria-label="Average rating {{ movie.rating }} out of 5">
            <span class="rating-stars" aria-hidden="true">★★★★★</span>
            <strong>{{ movie.rating }}</strong>
        </div>
        {% if movie.user_rating %}
            <div class="small fw-semibold text-success mb-3">Your rating: {{ movie.user_rating }}/5</div>
        {% else %}
            <div class="small text-secondary mb-3">Not rated yet</div>
        {% endif %}
        <div class="d-grid gap-2 mt-auto">
            <a class="btn btn-primary" href="{% url 'movies:detail' movie.id %}">Details & Rate</a>
        </div>
    </div>
</article>
