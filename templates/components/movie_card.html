{% load static %}
<article class="card movie-card h-100 border-0 shadow-sm">
    <img src="{% static movie.poster %}" class="card-img-top movie-poster" alt="Placeholder poster for {{ movie.title }}">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between align-items-start gap-2">
            <h3 class="h5 card-title mb-1">{{ movie.title }}</h3>
            <span class="badge rounded-pill text-bg-light">{{ movie.year }}</span>
        </div>
        <p class="text-secondary small mb-2">{{ movie.genres }}</p>
        <div class="rating-line mb-3" aria-label="Average rating {{ movie.rating }} out of 5">
            <span class="rating-stars" aria-hidden="true">★★★★★</span>
            <strong>{{ movie.rating }}</strong>
        </div>
        <div class="d-grid grid-template-buttons gap-2 mt-auto">
            <button class="btn btn-outline-primary" type="button" disabled title="Rating is integrated later">Rate</button>
            <button class="btn btn-primary" type="button" disabled title="Movie details are integrated later">Details</button>
        </div>
    </div>
</article>
